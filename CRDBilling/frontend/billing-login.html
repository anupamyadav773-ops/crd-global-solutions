<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRD Global Solutions - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="lamp-off">
    <div class="login-wrapper">
        <div class="scene-frame">
            <!-- Left: Kawaii Lamp Character -->
            <div class="lamp-column">
                <div class="lamp-visual" id="lampVisual">
                    <svg class="lamp-svg" viewBox="0 0 320 440" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Interactive Lamp">
                        <defs>
                            <!-- Lampshade mint gradient -->
                            <linearGradient id="shadeGrad" x1="60" y1="45" x2="260" y2="165" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#9fe0cd" />
                                <stop offset="45%" stop-color="#88ceb9" />
                                <stop offset="100%" stop-color="#6bb8a1" />
                            </linearGradient>

                            <!-- Inner Warm Glow of Shade -->
                            <radialGradient id="innerGlow" cx="160" cy="155" r="95" fx="160" fy="155" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#fffde8" />
                                <stop offset="50%" stop-color="#ffe99c" />
                                <stop offset="85%" stop-color="#ffcf66" />
                                <stop offset="100%" stop-color="#d49b38" />
                            </radialGradient>

                            <!-- Translucent Conical Light Beam -->
                            <linearGradient id="beamGrad" x1="160" y1="155" x2="160" y2="420" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#fffce6" stop-opacity="0.55" />
                                <stop offset="25%" stop-color="#72d3e0" stop-opacity="0.22" />
                                <stop offset="65%" stop-color="#2c6991" stop-opacity="0.10" />
                                <stop offset="100%" stop-color="#070c26" stop-opacity="0.0" />
                            </linearGradient>

                            <!-- Floor Spotlight Ellipse -->
                            <radialGradient id="floorGlowGrad" cx="160" cy="405" rx="140" ry="25" fx="160" fy="405" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#8ce9ff" stop-opacity="0.25" />
                                <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1" />
                                <stop offset="100%" stop-color="#070c26" stop-opacity="0" />
                            </radialGradient>

                            <!-- Stand / Post gradient -->
                            <linearGradient id="standGrad" x1="153" y1="155" x2="167" y2="155" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#ded8d0" />
                                <stop offset="50%" stop-color="#ffffff" />
                                <stop offset="100%" stop-color="#c9c1b7" />
                            </linearGradient>

                            <!-- Base pedestal gradient -->
                            <linearGradient id="baseTopGrad" x1="160" y1="375" x2="160" y2="390" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#ffffff" />
                                <stop offset="100%" stop-color="#ded7ce" />
                            </linearGradient>
                        </defs>

                        <!-- 1. Translucent Light Beam (Radiating Downward) -->
                        <g class="light-beam">
                            <polygon points="75,160 245,160 305,410 15,410" fill="url(#beamGrad)" />
                            <ellipse cx="160" cy="405" rx="145" ry="24" fill="url(#floorGlowGrad)" />
                        </g>

                        <!-- 2. Lamp Base Drop Shadow -->
                        <ellipse cx="160" cy="398" rx="72" ry="12" fill="rgba(0,0,0,0.4)" />

                        <!-- 3. Base Pedestal (3D Layered Discs) -->
                        <ellipse cx="160" cy="392" rx="76" ry="16" fill="#b8b0a5" />
                        <ellipse cx="160" cy="388" rx="76" ry="15" fill="url(#baseTopGrad)" />
                        <ellipse cx="160" cy="385" rx="66" ry="12" fill="#ece6de" />

                        <!-- 4. Lamp Stand / Neck Post -->
                        <rect x="153" y="155" width="14" height="230" rx="7" fill="url(#standGrad)" />

                        <!-- 5. Interactive Pull Cord & Knob (Left of stand) -->
                        <g class="pull-cord-group" id="lampPullCord" role="button" tabindex="0" aria-label="Toggle Lamp Light">
                            <!-- Cord Line -->
                            <line class="cord-line" x1="124" y1="160" x2="124" y2="270" stroke="#f1ece4" stroke-width="2.5" stroke-linecap="round" />
                            <!-- Pull Toggle Knob / Hand -->
                            <circle class="pull-toggle" cx="124" cy="274" r="8.5" fill="#f8fafc" stroke="#b4aba0" stroke-width="2" />
                            <circle cx="122" cy="271" r="2.5" fill="#ffffff" />
                        </g>

                        <!-- 6. Inner Warm Aperture (Under Shade) -->
                        <ellipse class="inner-aperture" cx="160" cy="155" rx="90" ry="18" fill="url(#innerGlow)" />

                        <!-- 7. Conical Lamp Shade Body -->
                        <path d="M 108 45 
                                 C 108 45, 68 152, 68 155 
                                 C 68 168, 252 168, 252 155 
                                 C 252 152, 212 45, 212 45 
                                 C 212 37, 108 37, 108 45 Z" 
                              fill="url(#shadeGrad)" 
                              stroke="rgba(255,255,255,0.18)" 
                              stroke-width="1.5" />

                        <!-- Top rim of shade -->
                        <ellipse cx="160" cy="45" rx="52" ry="9" fill="#88ceb9" />

                        <!-- 8. Kawaii Face on Lampshade -->
                        <!-- 8A: Happy Awake Face (default when ON) -->
                        <g class="face-awake" id="faceAwake">
                            <!-- Left Smiling Eye Arc -->
                            <path class="eye eye-left" d="M 124 96 Q 133 84 142 96" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none" />
                            <!-- Right Smiling Eye Arc -->
                            <path class="eye eye-right" d="M 178 96 Q 187 84 196 96" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none" />
                            <!-- Happy Open Mouth with Cute Tongue -->
                            <path d="M 146 106 C 146 106 146 126 160 126 C 174 126 174 106 174 106 Z" fill="#0f172a" />
                            <!-- Pink Tongue -->
                            <path d="M 152 117 C 152 117 155 125 160 125 C 165 125 168 117 168 117 Z" fill="#fb7185" />
                            <!-- Soft Cheeks Blush -->
                            <ellipse cx="118" cy="105" rx="7" ry="4" fill="#f43f5e" opacity="0.35" />
                            <ellipse cx="202" cy="105" rx="7" ry="4" fill="#f43f5e" opacity="0.35" />
                        </g>

                        <!-- 8B: Shy/Winking Eyes (When typing password) -->
                        <g class="shy-eyes" id="faceShy">
                            <path d="M 124 97 Q 133 103 142 97" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
                            <path d="M 178 97 Q 187 103 196 97" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
                            <path d="M 152 114 Q 160 120 168 114" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none" />
                            <ellipse cx="118" cy="105" rx="9" ry="5" fill="#f43f5e" opacity="0.5" />
                            <ellipse cx="202" cy="105" rx="9" ry="5" fill="#f43f5e" opacity="0.5" />
                        </g>

                        <!-- 8C: Sleeping Face (when Lamp is OFF) -->
                        <g class="face-sleeping" id="faceSleeping">
                            <path d="M 124 96 L 142 96" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
                            <path d="M 178 96 L 196 96" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
                            <path d="M 153 114 Q 160 119 167 114" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
                        </g>
                    </svg>

                    <div class="cord-hint" id="cordHint">
                        <span>💡 Click or pull string to turn light on/off</span>
                    </div>
                </div>
            </div>

            <!-- Right: Glowing Neon Login Card -->
            <div class="login-column">
                <div class="login-card" id="loginCard">
                    <div class="brand-header">
                        <span class="brand-pill">CRD Global Solutions</span>
                        <h1>Welcome Back</h1>
                    </div>

                    <form id="loginForm" novalidate>
                        <div class="form-group">
                            <label class="form-label" for="username">Username</label>
                            <div class="input-wrapper">
                                <input 
                                    type="text" 
                                    id="username" 
                                    name="username" 
                                    class="form-input" 
                                    placeholder="Enter your username" 
                                    autocomplete="username" 
                                    required
                                />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-wrapper">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    class="form-input" 
                                    placeholder="Enter your password" 
                                    autocomplete="current-password" 
                                    required
                                />
                                <button type="button" class="toggle-password-btn" id="togglePasswordBtn" title="Show / Hide password" aria-label="Show or hide password">
                                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-login" id="btnLogin">
                            <span>Login</span>
                        </button>

                        <!-- Technician App Download Section (Directly under Login Option) -->
                        <div class="tech-app-download-box" style="margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.1); text-align: center;">
                            <div style="font-size: 11.5px; color: #94a3b8; margin-bottom: 8px;">
                                🛠️ फील्ड तकनीशियन हैं? (Field Technician?)
                            </div>
                            <a href="/downloads/PariTechnician.apk" download="PariTechnician.apk" class="btn-download-tech-app" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box; padding: 11px 16px; background: rgba(16, 185, 129, 0.15); border: 1.5px solid #10b981; border-radius: 12px; color: #34d399; font-size: 13px; font-weight: 700; text-decoration: none; transition: all 0.2s ease;">
                                <span>📱 Download Technician App (APK)</span>
                            </a>
                            <div style="font-size: 10.5px; color: #64748b; margin-top: 6px; line-height: 1.4;">
                                * तकनीशियन केवल मोबाइल ऐप में लॉगिन कर सकते हैं।
                            </div>
                        </div>

                        <div class="forgot-link-wrapper" style="margin-top: 14px;">
                            <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
                        </div>

                        <div class="login-error" id="loginErrorMsg" role="alert" aria-live="assertive"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
