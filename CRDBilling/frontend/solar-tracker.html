<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar File Tracker | CRD Global Solutions</title><link rel="stylesheet" href="solar-tracker.css"><script src="config.js"></script><script src="auth.js"></script></head><body>
<header><div><small>CRD GLOBAL SOLUTIONS</small><h1>☀️ Solar File Tracker</h1><p>Checklist aur workflow tracking — documents upload karne ki zaroorat nahi.</p></div><button id="newBtn">＋ नया ग्राहक</button></header><main><section id="stats" class="stats"></section><section class="tools"><input id="search" placeholder="ग्राहक, मोबाइल या Project ID खोजें"><select id="filter"><option value="all">सभी ग्राहक</option><option value="installation">Installation बाकी</option><option value="discom">DISCOM submission बाकी</option><option value="meter">Net meter बाकी</option><option value="subsidy">Subsidy बाकी</option></select></section><section id="projects" class="projects">लोड हो रहा है...</section></main>
<div id="modal" class="modal hidden"><div class="dialog"><div class="dialoghead"><div><h2 id="formTitle">नया Solar ग्राहक</h2><p>केवल checklist/status भरें; कोई फाइल upload नहीं होगी।</p></div><button id="closeBtn" class="close">×</button></div><form id="form"><input type="hidden" id="id"><div class="grid"><label>ग्राहक का नाम *<input id="customer_name" required></label><label>मोबाइल<input id="phone"></label><label class="wide">पता<input id="address"></label><label>सिस्टम क्षमता (kW)<input id="system_capacity_kw" type="number" min="0" step=".01"></label><label>भुगतान का प्रकार<select id="payment_type"><option value="direct">सीधा भुगतान</option><option value="finance">Finance / Bank Loan</option></select></label><div id="financeFields" class="finance wide hidden"><label>Bank / Finance Provider<input id="finance_provider"></label><label>Finance Status<select id="finance_status"><option value="pending">Pending</option><option value="applied">Applied</option><option value="approved">Approved</option><option value="disbursed">Disbursed</option><option value="rejected">Rejected</option></select></label></div><div class="wide"><h3>दस्तावेज़ Checklist</h3><p class="hint">दस्तावेज़ मिल गए हों तो tick करें। फाइल अपलोड नहीं करनी है।</p><div id="checklist" class="checks"></div></div><label>Installation Status<select id="installation_status"><option value="pending">बाकी</option><option value="in_progress">काम जारी</option><option value="completed">पूरा</option></select></label><label>Installation Date<input id="installation_date" type="date"></label><label>DISCOM Status<select id="discom_status"><option value="pending">जमा करना बाकी</option><option value="submitted">जमा हो गए</option><option value="returned">Correction/Returned</option></select></label><label>DISCOM Submission Date<input id="discom_submission_date" type="date"></label><label>DISCOM Reference / Acknowledgment<input id="discom_reference"></label><label>Net Meter Status<select id="net_meter_status"><option value="pending">बाकी</option><option value="in_progress">प्रक्रिया में</option><option value="installed">लग गया</option></select></label><label>Net Meter Date<input id="net_meter_date" type="date"></label><label>Subsidy Status<select id="subsidy_status"><option value="pending">बाकी</option><option value="applied">आवेदन किया</option><option value="processing">प्रक्रिया में</option><option value="received">प्राप्त हो गई</option><option value="rejected">अस्वीकृत</option></select></label><label>Subsidy Applied Date<input id="subsidy_applied_date" type="date"></label><label>Subsidy Received Date<input id="subsidy_received_date" type="date"></label><label>Subsidy Amount (₹)<input id="subsidy_amount" type="number" min="0" step=".01"></label><label class="wide">Notes / अगला काम<textarea id="notes" rows="3"></textarea></label></div><div class="actions"><button type="button" id="cancelBtn" class="secondary">रद्द करें</button><button type="submit">सेव करें</button></div><p id="message" class="message"></p></form></div></div><script src="solar-tracker.js"></script></body></html>
